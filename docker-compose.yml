version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: futura-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: futura-labs-ai-tutor-lms

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: futura-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/futura-labs-ai-tutor-lms

volumes:
  mongodb_data:
